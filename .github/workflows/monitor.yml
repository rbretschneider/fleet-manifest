# Keeps manifest.json current for Nectar Mobile apps.
#   - schedule: probe the service endpoint; update on change.
#   - repository_dispatch (event_type: upstream): an infrastructure signal;
#     state "degraded" flips to outage immediately, "restored" re-probes.
#   - workflow_dispatch: manual maintenance switch.
# Operational runbook lives in private documentation, not here.

name: Manifest

on:
  schedule:
    - cron: "*/5 * * * *"
  repository_dispatch:
    types: [upstream]
  workflow_dispatch:
    inputs:
      mode:
        description: "maintenance or auto"
        type: choice
        options: [maintenance, auto]
        required: true
      message:
        description: "Message shown in apps"
        required: false
        default: "Down for scheduled maintenance — back soon."

permissions:
  contents: write

concurrency:
  group: manifest
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Determine desired state
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          SIGNAL: ${{ github.event.client_payload.state }}
          MODE: ${{ inputs.mode }}
          MESSAGE: ${{ inputs.message }}
        run: |
          set -euo pipefail
          current_status=$(jq -r .status manifest.json)

          status=""; message=""
          case "$EVENT" in
            workflow_dispatch)
              if [ "$MODE" = "maintenance" ]; then
                status="maintenance"; message="$MESSAGE"
              else
                status="probe"
              fi
              ;;
            repository_dispatch)
              if [ "$SIGNAL" = "degraded" ]; then
                status="outage"
                message="Sync is temporarily unavailable. Your data is safe on your device and will catch up automatically."
              else
                status="probe"
              fi
              ;;
            schedule)
              # The schedule never overrides a manual maintenance flag.
              if [ "$current_status" = "maintenance" ]; then
                echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
              fi
              status="probe"
              ;;
          esac

          if [ "$status" = "probe" ]; then
            healthy=false
            for attempt in 1 2 3; do
              if curl -sf --max-time 10 https://sync.nectarmobile.dev/health >/dev/null; then
                healthy=true; break
              fi
              sleep 20
            done
            if [ "$healthy" = true ]; then
              status="ok"; message=""
            else
              status="outage"
              message="Sync is temporarily unavailable. Your data is safe on your device and will catch up automatically."
            fi
          fi

          if [ "$status" = "$current_status" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          {
            echo "skip=false"
            echo "status=$status"
            echo "message=$message"
          } >> "$GITHUB_OUTPUT"

      - name: Publish manifest
        if: steps.decide.outputs.skip != 'true'
        env:
          STATUS: ${{ steps.decide.outputs.status }}
          MESSAGE: ${{ steps.decide.outputs.message }}
        run: |
          set -euo pipefail
          jq -n --arg s "$STATUS" --arg m "$MESSAGE" \
             --arg t "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
             '{status:$s, message:$m, updatedAt:$t}' > manifest.json
          git config user.name "manifest-bot"
          git config user.email "manifest-bot@users.noreply.github.com"
          git add manifest.json
          git commit -m "sync manifest"
          git push

      - name: Keepalive
        if: steps.decide.outputs.skip == 'true'
        run: |
          set -euo pipefail
          last=$(git log -1 --format=%ct)
          age_days=$(( ( $(date +%s) - last ) / 86400 ))
          if [ "$age_days" -ge 45 ]; then
            date -u +%Y-%m-%dT%H:%M:%SZ > .keepalive
            git config user.name "manifest-bot"
            git config user.email "manifest-bot@users.noreply.github.com"
            git add .keepalive
            git commit -m "sync manifest"
            git push
          fi
